<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../favicon.png"/>
    <title>Realtime Virtual Hugs</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu', sans-serif; /* Apply Ubuntu font to the entire page */
        }

        .header {
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid #ccc;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            font-family: 'Ubuntu', sans-serif; /* Apply Ubuntu font to the header */
        }

        .home-button {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #7986CB;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
        }

        .home-button:hover {
            color: #3949AB;
            transform: translateY(-50%) scale(1.1);
        }

        .home-button svg {
            display: block;
        }

        .sound-button {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            color: #7986CB;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
        }

        .sound-button:hover {
            color: #3949AB;
            transform: translateY(-50%) scale(1.1);
        }

        .sound-button svg {
            display: block;
        }

        .autocenter-button {
            position: absolute;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
            color: #7986CB;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
        }

        .autocenter-button:hover {
            color: #3949AB;
            transform: translateY(-50%) scale(1.1);
        }

        .autocenter-button svg {
            display: block;
        }

        #map {
            height: calc(100vh - 60px); /* Adjust height to make room for the title */
        }

        .legend {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000; /* Ensure the legend is above other elements */
            font-family: 'Ubuntu', sans-serif; /* Apply Ubuntu font to the legend */
        }
    </style>
</head>
<body>
<div class="header">
    Realtime Virtual Hugs
    <button id="autocenterToggle" class="autocenter-button" title="Disable Auto-Center">
        <svg id="autocenterOnIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
        </svg>
        <svg id="autocenterOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
            <path d="M20.85 18.02L4.25 1.42 2.98 2.69l3.35 3.35C4.78 7.41 3.65 9.07 3.17 11H1.1v2h2.07c.43 1.72 1.34 3.25 2.58 4.41l-2.03 2.03 1.27 1.27 2.03-2.03c1.16 1.24 2.69 2.15 4.41 2.58V23.4h2v-2.07c1.93-.48 3.59-1.61 4.94-3.16l3.35 3.35 1.27-1.27-1.27-1.27-.06-.06zm-8.85 1.29c-2.76 0-5-2.24-5-5 0-.71.16-1.39.42-2l6.58 6.58c-.61.26-1.29.42-2 .42zM12.23 3.52V1.4h-2v2.12c-1.93.48-3.59 1.61-4.94 3.16L6.56 8c.61-.26 1.29-.42 2-.42 2.76 0 5 2.24 5 5 0 .71-.16 1.39-.42 2l1.27 1.27c1.24-1.16 2.15-2.69 2.58-4.41H19.1v-2h-2.07c-.43-1.72-1.34-3.25-2.58-4.41l2.03-2.03-1.27-1.27L12.23 3.52z"/>
        </svg>
    </button>
    <button id="soundToggle" class="sound-button" title="Enable Sound">
        <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="display: none;">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </button>
    <a href="../about/" class="home-button" title="Home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
    </a>
</div>
<div id="map"></div>
<div class="legend" id="legend">
    <strong>Hugs Sent:</strong> <span id="sentCount">0</span><br>
    <strong>Hugs Received:</strong> <span id="receivedCount">0</span><br>
    <strong>Last Hug:</strong> <span id="lastHug">N/A</span>
</div>
<script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    // Initialize Firebase
    var firebaseConfig = {
        apiKey: "AIzaSyBeJhhyes4B52kiauHTCavdwzS2UiTMqLM",
        authDomain: "hugmeter.firebaseapp.com",
        databaseURL: "https://hugmeter-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "hugmeter",
        storageBucket: "hugmeter.appspot.com",
        messagingSenderId: "145109323797",
        appId: "1:145109323797:web:06f09799100486024c3e1c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();

    // Retrieve map position and zoom level from Local Storage
    var savedLat = localStorage.getItem('mapLat');
    var savedLng = localStorage.getItem('mapLng');
    var savedZoom = localStorage.getItem('mapZoom');

    var mapLat = savedLat ? parseFloat(savedLat) : 0;
    var mapLng = savedLng ? parseFloat(savedLng) : 0;
    var mapZoom = savedZoom ? parseInt(savedZoom) : 2;

    // Initialize the map
    var map = L.map('map').setView([mapLat, mapLng], mapZoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Save map position and zoom level to Local Storage
    map.on('moveend', function() {
        var center = map.getCenter();
        localStorage.setItem('mapLat', center.lat);
        localStorage.setItem('mapLng', center.lng);
        localStorage.setItem('mapZoom', map.getZoom());
    });

    // Color code
    const color = '#7986CB'; // Hex color code

    // Custom circle markers
    function createCircleMarker(latlng, color) {
        return L.circleMarker(latlng, {
            radius: 8,
            fillColor: color,
            color: color, // Border color of the marker
            weight: 1,
            opacity: 1,
            fillOpacity: 1
        });
    }

    // Function to draw a line between markers
    function drawLine(fromLatLng, toLatLng) {
        return L.polyline([fromLatLng, toLatLng], {
            color: color, // Color of the line
            weight: 2,
            opacity: 0.8
        }).addTo(map);
    }

    // Function to format timestamp to readable date and time
    function formatTimestamp(timestamp) {
        var date = new Date(timestamp);
        return date.toLocaleString(); // Format to local date and time string
    }

    // Counters for hugs sent and received
    let sentCount = 0;
    let receivedCount = 0;

    // Update the legend with counts and last hug timestamp
    function updateLegend(lastHugTimestamp) {
        document.getElementById('sentCount').textContent = sentCount;
        document.getElementById('receivedCount').textContent = receivedCount;
        document.getElementById('lastHug').textContent = lastHugTimestamp ? formatTimestamp(lastHugTimestamp) : 'N/A';
    }

    // Listen for changes in the Firebase Realtime Database
    database.ref('!web-socket-virtual-hugs/events').on('child_added', function(snapshot) {
        var event = snapshot.val();
        var fromMarker, toMarker, line;

        var lastHugTimestamp = parseInt(snapshot.key); // Use the timestamp from the event key

        if (event.from && event.to) {
            fromMarker = createCircleMarker([event.from.latitude, event.from.longitude], color).addTo(map);
            toMarker = createCircleMarker([event.to.latitude, event.to.longitude], color).addTo(map);

            line = drawLine(
                L.latLng(event.from.latitude, event.from.longitude),
                L.latLng(event.to.latitude, event.to.longitude)
            );

            receivedCount++;
            updateLegend(lastHugTimestamp);
            playHugReceivedSound();

            if (autocenterEnabled) {
                var targetZoom = map.getZoom() < 4 ? 5 : map.getZoom();
                map.flyTo([event.to.latitude, event.to.longitude], targetZoom, {
                    animate: true,
                    duration: 2.0
                });
            }
        } else if (event.from) {
            fromMarker = createCircleMarker([event.from.latitude, event.from.longitude], color).addTo(map);
            sentCount++;
            updateLegend(lastHugTimestamp);
            playHugSentSound();

            if (autocenterEnabled) {
                var targetZoom = map.getZoom() < 4 ? 5 : map.getZoom();
                map.flyTo([event.from.latitude, event.from.longitude], targetZoom, {
                    animate: true,
                    duration: 2.0
                });
            }
        } else if (event.to) {
            toMarker = createCircleMarker([event.to.latitude, event.to.longitude], color).addTo(map);
            receivedCount++;
            updateLegend(lastHugTimestamp);
            playHugReceivedSound();

            if (autocenterEnabled) {
                var targetZoom = map.getZoom() < 4 ? 5 : map.getZoom();
                map.flyTo([event.to.latitude, event.to.longitude], targetZoom, {
                    animate: true,
                    duration: 2.0
                });
            }
        }

        // Remove markers and lines after a few seconds
        setTimeout(function() {
            if (fromMarker) map.removeLayer(fromMarker);
            if (toMarker) map.removeLayer(toMarker);
            if (line) map.removeLayer(line);
        }, 5000); // 5 seconds
    });

    // Initialize the legend
    updateLegend();

    // Web Audio API Sound Synthesizer
    var audioCtx = null;
    var soundEnabled = false; // Sound is initially disabled (muted)

    function initAudio() {
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('Web Audio API not supported in this browser', e);
            }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Play a gentle warm sound for sent hugs (ascending tones)
    function playHugSentSound() {
        initAudio();
        if (!audioCtx || !soundEnabled) return;

        try {
            var now = audioCtx.currentTime;
            
            // We use two quick warm notes (e.g. C5 then G5)
            // Note 1: C5 (523.25 Hz)
            var osc1 = audioCtx.createOscillator();
            var gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(523.25, now);
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.08, now + 0.03);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            // Note 2: G5 (783.99 Hz) starting slightly after
            setTimeout(function() {
                if (!soundEnabled || !audioCtx) return;
                try {
                    var now2 = audioCtx.currentTime;
                    var osc2 = audioCtx.createOscillator();
                    var gain2 = audioCtx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(783.99, now2);
                    gain2.gain.setValueAtTime(0, now2);
                    gain2.gain.linearRampToValueAtTime(0.08, now2 + 0.03);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now2 + 0.25);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now2);
                    osc2.stop(now2 + 0.25);
                } catch (err) {}
            }, 80);
        } catch (e) {
            console.error('Error playing sent sound:', e);
        }
    }

    // Play a gentle cozy sound for received hugs (descending warm tones)
    function playHugReceivedSound() {
        initAudio();
        if (!audioCtx || !soundEnabled) return;

        try {
            var now = audioCtx.currentTime;

            // Note 1: A5 (880.00 Hz)
            var osc1 = audioCtx.createOscillator();
            var gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(880, now);
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.08, now + 0.03);
            gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            // Note 2: E5 (659.25 Hz) starting slightly after
            setTimeout(function() {
                if (!soundEnabled || !audioCtx) return;
                try {
                    var now2 = audioCtx.currentTime;
                    var osc2 = audioCtx.createOscillator();
                    var gain2 = audioCtx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(659.25, now2);
                    gain2.gain.setValueAtTime(0, now2);
                    gain2.gain.linearRampToValueAtTime(0.08, now2 + 0.03);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now2 + 0.25);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now2);
                    osc2.stop(now2 + 0.25);
                } catch (err) {}
            }, 80);
        } catch (e) {
            console.error('Error playing received sound:', e);
        }
    }

    // Sound Toggle Button Logic
    var soundToggle = document.getElementById('soundToggle');
    var soundOffIcon = document.getElementById('soundOffIcon');
    var soundOnIcon = document.getElementById('soundOnIcon');

    soundToggle.addEventListener('click', function() {
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
            soundOffIcon.style.display = 'none';
            soundOnIcon.style.display = 'block';
            soundToggle.title = 'Disable Sound';
            
            // Warmly initialize audio context and play a tiny soft chime to confirm
            initAudio();
            if (audioCtx) {
                try {
                    var now = audioCtx.currentTime;
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.04, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } catch (e) {}
            }
        } else {
            soundOffIcon.style.display = 'block';
            soundOnIcon.style.display = 'none';
            soundToggle.title = 'Enable Sound';
        }
    });

    // Autocenter Toggle Logic
    var autocenterEnabled = true;
    var autocenterToggle = document.getElementById('autocenterToggle');
    var autocenterOnIcon = document.getElementById('autocenterOnIcon');
    var autocenterOffIcon = document.getElementById('autocenterOffIcon');

    autocenterToggle.addEventListener('click', function() {
        autocenterEnabled = !autocenterEnabled;
        if (autocenterEnabled) {
            autocenterOnIcon.style.display = 'block';
            autocenterOffIcon.style.display = 'none';
            autocenterToggle.title = 'Disable Auto-Center';
        } else {
            autocenterOnIcon.style.display = 'none';
            autocenterOffIcon.style.display = 'block';
            autocenterToggle.title = 'Enable Auto-Center';
        }
    });
</script>
</body>
</html>
